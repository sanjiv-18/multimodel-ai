services:
  - type: web
    name: learnflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        value: sqlite:///./learnflow.db
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: fallback
      - key: EMBEDDING_PROVIDER
        value: tfidf_cosine
